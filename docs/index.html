function priceChange(data, field) {
  if (data.length < 2) return { pct: 0, abs: 0 };
  const curr = data[data.length - 1][field];
  const prev = data[data.length - 2][field];
  return { pct: prev > 0 ? ((curr - prev) / prev * 100) : 0, abs: curr - prev };
}

// === Render Functions ===
function renderCards(lang) {
  const t = i18n[lang];
  const cardsDiv = document.getElementById('summary-cards');
  cardsDiv.innerHTML = '';
  const ceaChange = priceChange(ceaData, 'closing_price');
  const ceaChangeColor = ceaChange.abs >= 0 ? '#48bb78' : '#fc8181';
  const ceaChangeSign = ceaChange.abs >= 0 ? '+' : '';

  const cardDefs = [
    {
      value: ceaSummary.latest_closing_price ? `¥${fmt(ceaSummary.latest_closing_price, 2)}` : 'N/A',
      label: t.ceaLatestPrice,
      sub: ceaData.length >= 2 ? `<span style="color:${ceaChangeColor}">${ceaChangeSign}${fmt(ceaChange.abs, 2)} (${ceaChangeSign}${ceaChange.pct.toFixed(2)}%)</span>` : '',
    },
    {
      value: ceaSummary.total_trading_days || 0,
      label: t.ceaTradingDays,
      sub: ceaSummary.first_date && ceaSummary.last_date ? `${ceaSummary.first_date} ~ ${ceaSummary.last_date}` : '',
    },
    {
      value: ceaSummary.min_price && ceaSummary.max_price ? `¥${fmt(ceaSummary.min_price, 2)} - ¥${fmt(ceaSummary.max_price, 2)}` : 'N/A',
      label: t.ceaPriceRange,
      sub: ceaSummary.avg_price ? `${t.avg}: ¥${fmt(ceaSummary.avg_price, 2)}` : '',
    },
    {
      value: ccerSummary.latest_avg_price ? `¥${fmt(ccerSummary.latest_avg_price, 2)}` : 'N/A',
      label: t.ccerLatestPrice,
      sub: `${ccerData.length} ${t.tradingDays}`,
    },
  ];
  cardDefs.forEach(c => {
    const div = document.createElement('div');
    div.className = 'card';
    div.innerHTML = `<div class="value">${c.value}</div><div class="label">${c.label}</div>${c.sub ? '<div class="sub">' + c.sub + '</div>' : ''}`;
    cardsDiv.appendChild(div);
  });
}

let chartsInitialized = false;

function initCharts(lang) {
  const t = i18n[lang];

  // 1. CEA Closing Price — year-colored lines + volume bars
  if (ceaData.length > 0) {
    const ceaYears = [...new Set(ceaData.map(d => d.date.substring(0, 4)))].sort();
    const yearColors = ['#63b3ed','#48bb78','#ed8936','#fc8181','#9f7aea','#f6e05e','#38b2ac'];
    const priceTraces = ceaYears.map((yr, i) => {
      const yd = ceaData.filter(d => d.date.startsWith(yr));
      return {
        x: yd.map(d => d.date), y: yd.map(d => d.closing_price),
        type: 'scatter', mode: 'lines',
        line: { color: yearColors[i % yearColors.length], width: 1.8 },
        name: yr,
        hovertemplate: `${yr}<br>%{x}<br>¥%{y:.2f}/ton<extra></extra>`,
      };
    });
    const volDefs = [
      { key: 'listed_volume', color: 'rgba(66,153,225,0.35)' },
      { key: 'block_volume', color: 'rgba(245,101,101,0.35)' },
      { key: 'total_volume', color: 'rgba(160,174,192,0.25)' },
    ];
    const volNames = [t.volListed, t.volBlock, t.volTotal];
    const volTraces = volDefs.map((v, i) => ({
      x: ceaData.map(d => d.date), y: ceaData.map(d => d[v.key]),
      type: 'bar', name: volNames[i], yaxis: 'y2',
      marker: { color: v.color },
      hovertemplate: `${volNames[i]}<br>%{x}<br>%{y:,.0f}<extra></extra>`,
      visible: 'legendonly',
    }));
    const allTraces = [...priceTraces, ...volTraces];
    Plotly.newPlot('cea-price-chart', allTraces, {
      ...darkLayout,
      title: { text: t.ceaPriceTrend, font: { color: '#63b3ed', size: 16 } },
      xaxis: { ...darkLayout.xaxis, rangeslider: { visible: true, bgcolor: '#1a2332' } },
      yaxis: { ...darkLayout.yaxis, title: { text: t.priceUnit, standoff: 10 } },
      yaxis2: { overlaying: 'y', side: 'right', title: t.volumeUnit, gridcolor: 'transparent', font: { color: '#718096' }, tickfont: { color: '#718096' } },
      height: 480,
      showlegend: false,
      barmode: 'overlay',
    }, plotlyConfig);
    buildCeaPriceFilter(ceaYears, yearColors, volDefs, t);
  }

  // 2. Candlestick + Volume
  if (ceaOhlcData.length > 0) {
    const ohlcDates = ceaOhlcData.map(d => d.date);
    Plotly.newPlot('cea-candlestick-chart', [{
      x: ohlcDates,
      open: ceaOhlcData.map(d => d.opening_price),
      high: ceaOhlcData.map(d => d.high_price),
      low: ceaOhlcData.map(d => d.low_price),
      close: ceaOhlcData.map(d => d.closing_price),
      type: 'candlestick', name: 'OHLC',
      increasing: { line: { color: '#48bb78' }, fillcolor: 'rgba(72,187,120,0.3)' },
      decreasing: { line: { color: '#fc8181' }, fillcolor: 'rgba(252,129,129,0.3)' },
    }, {
      x: ohlcDates,
      y: ceaOhlcData.map(d => d.total_volume),
      type: 'bar', name: 'Volume', yaxis: 'y2',
      marker: { color: ceaOhlcData.map(d => d.closing_price >= d.opening_price ? 'rgba(72,187,120,0.4)' : 'rgba(252,129,129,0.4)') },
      hovertemplate: '%{x}<br>Volume: %{y:,.0f}<extra></extra>',
    }], {
      ...darkLayout,
      title: { text: t.ceaCandlestick, font: { color: '#63b3ed', size: 16 } },
      yaxis: { ...darkLayout.yaxis, title: t.priceUnit, domain: [0.3, 1] },
      yaxis2: { title: t.volumeUnit, gridcolor: '#2d3748', linecolor: '#2d3748', domain: [0, 0.25], anchor: 'x', font: { color: '#e0e0e0' } },
      xaxis: { ...darkLayout.xaxis, rangeslider: { visible: false } },
      height: 500,
      showlegend: false,
    }, plotlyConfig);
  } else {
    document.getElementById('cea-candlestick-chart').innerHTML = `<p style="text-align:center;padding:40px;color:#718096;">${t.noOhlc}</p>`;
  }

  // 3. Annual Box Plot
  if (ceaData.length > 0) {
    const dates = ceaData.map(d => d.date);
    const years = [...new Set(dates.map(d => d.substring(0, 4)))].sort();
    const colors = ['#63b3ed', '#48bb78', '#ed8936', '#fc8181', '#9f7aea', '#f6e05e'];
    const boxTraces = years.map((year, i) => ({
      y: ceaData.filter(d => d.date.startsWith(year)).map(d => d.closing_price),
      type: 'box', name: year,
      marker: { color: colors[i % colors.length] },
      boxpoints: 'outliers',
    }));
    Plotly.newPlot('cea-annual-box', boxTraces, {
      ...darkLayout,
      title: { text: t.annualDistribution, font: { color: '#63b3ed', size: 16 } },
      yaxis: { ...darkLayout.yaxis, title: t.closingPrice },
      showlegend: false,
      height: 420,
    }, plotlyConfig);
    buildBoxFilter(years, colors, t);

    // 4. Monthly Volume Heatmap
    const monthlyData = {};
    ceaData.forEach(d => {
      const year = d.date.substring(0, 4);
      const month = parseInt(d.date.substring(5, 7));
      const key = `${year}-${month}`;
      monthlyData[key] = (monthlyData[key] || 0) + d.total_volume;
    });
    const heatYears = [...new Set(ceaData.map(d => d.date.substring(0, 4)))].sort();
    const months = Array.from({length: 12}, (_, i) => i + 1);
    const zData = heatYears.map(y => months.map(m => {
      const v = monthlyData[`${y}-${m}`];
      return v && v > 0 ? Math.round(v / 10000) : null;
    }));
    Plotly.newPlot('cea-monthly-heatmap', [{
      z: zData, x: t.months, y: heatYears,
      type: 'heatmap', colorscale: 'YlOrRd', connectgaps: false,
      colorbar: { title: { text: t.volumeWan, side: 'right' }, tickfont: { color: '#e0e0e0' } },
      hovertemplate: '%{y} %{x}<br>%{z:,.0f}<extra></extra>',
      zmin: 0,
    }], {
      ...darkLayout,
      title: { text: t.monthlyHeatmap, font: { color: '#63b3ed', size: 16 } },
      xaxis: { ...darkLayout.xaxis, type: 'category' },
      yaxis: { ...darkLayout.yaxis, type: 'category', autorange: 'reversed' },
      height: 380,
    }, plotlyConfig);
  }

  // 5. CCER Price Chart — break line at gaps > 14 days
  if (ccerData.length > 0) {
    const ccerX = [], ccerY = [];
    for (let i = 0; i < ccerData.length; i++) {
      if (i > 0) {
        const prev = new Date(ccerData[i - 1].date);
        const curr = new Date(ccerData[i].date);
        if ((curr - prev) / 86400000 > 14) {
          ccerX.push(null);
          ccerY.push(null);
        }
      }
      ccerX.push(ccerData[i].date);
      ccerY.push(ccerData[i].avg_price);
    }
    Plotly.newPlot('ccer-price-chart', [{
      x: ccerX, y: ccerY,
      type: 'scatter', mode: 'lines+markers',
      line: { color: '#ed8936', width: 2 },
      marker: { size: 7, color: '#ed8936' },
      name: 'CCER',
      connectgaps: false,
      hovertemplate: '%{x}<br>¥%{y:.2f}/ton<extra></extra>',
    }], {
      ...darkLayout,
      title: { text: t.ccerPriceTrend, font: { color: '#ed8936', size: 16 } },
      xaxis: { ...darkLayout.xaxis, type: 'date', rangeslider: { visible: true, bgcolor: '#1a2332' } },
      yaxis: { ...darkLayout.yaxis, title: t.priceUnit },
      height: 420,
    }, plotlyConfig);
  } else {
    document.getElementById('ccer-price-chart').innerHTML = `<p style="text-align:center;padding:40px;color:#718096;">${t.noCcer}</p>`;
  }

  chartsInitialized = true;
}

// === Filter Bar Logic ===
// Generic filter manager factory
function createFilter(chartId, barId) {
  const f = {
    state: {}, traceMap: {}, groups: {}, groupOrder: [], groupColors: {},
    defaultOn: new Set(),

    apply() {
      const el = document.getElementById(chartId);
      if (!el || !el.data) return;
      const vis = el.data.map((_, i) => {
        const key = Object.keys(f.traceMap).find(k => f.traceMap[k] === i);
        return key && f.state[key] ? true : 'legendonly';
      });
      Plotly.restyle(chartId, { visible: vis });
    },

    updateUI() {
      // Update type chips
      Object.keys(f.state).forEach(key => {
        const chip = document.getElementById(`pf-${barId}-${key}`);
        if (chip) chip.classList.toggle('on', !!f.state[key]);
      });
      // Update group state
      f.groupOrder.forEach(grp => {
        const items = f.groups[grp];
        if (!items) return;
        const btn = document.getElementById(`pf-grp-${barId}-${grp}`);
        if (!btn) return;
        const onCount = items.filter(it => f.state[it.key]).length;
        btn.classList.remove('g-on', 'g-partial');
        if (onCount === items.length) btn.classList.add('g-on');
        else if (onCount > 0) btn.classList.add('g-partial');
      });
    },

    setAll(on) { Object.keys(f.state).forEach(k => { f.state[k] = on; }); f.apply(); f.updateUI(); },
    setGroup(grp, on) { (f.groups[grp] || []).forEach(it => { f.state[it.key] = on; }); f.apply(); f.updateUI(); },
    toggle(key) { f.state[key] = !f.state[key]; f.apply(); f.updateUI(); },
    reset() {
      Object.keys(f.state).forEach(k => { f.state[k] = f.defaultOn.has(k); });
      f.apply(); f.updateUI();
      document.querySelectorAll(`#${barId} .pf-sub.open`).forEach(el => el.classList.remove('open'));
      document.querySelectorAll(`#${barId} .pf-grp.expanded`).forEach(el => el.classList.remove('expanded'));
    },

    build(t) {
      const bar = document.getElementById(barId);
      bar.innerHTML = '';
      const row1 = document.createElement('div');
      row1.className = 'pf-row';

      const mkCtrl = (label, fn) => {
        const b = document.createElement('span');
        b.className = 'pf-btn pf-ctrl';
        b.textContent = label;
        b.onclick = fn;
        return b;
      };
      row1.appendChild(mkCtrl(t.filterAll, () => f.setAll(true)));
      row1.appendChild(mkCtrl(t.filterNone, () => f.setAll(false)));
      row1.appendChild(mkCtrl(t.filterReset, () => f.reset()));

      if (f.groupOrder.length > 1) {
        // Multi-group: add group chips with expand
        const sep = document.createElement('span'); sep.className = 'pf-sep';
        row1.appendChild(sep);

        f.groupOrder.forEach(grp => {
          if (!f.groups[grp]) return;
          const cnt = f.groups[grp].length;
          const onCount = f.groups[grp].filter(it => f.state[it.key]).length;
          const b = document.createElement('span');
          b.className = 'pf-btn pf-grp' + (onCount === cnt ? ' g-on' : onCount > 0 ? ' g-partial' : '');
          b.id = `pf-grp-${barId}-${grp}`;
          b.style.setProperty('--c', f.groupColors[grp] || '#4a5568');
          b.innerHTML = `${grp}<span style="opacity:0.6;font-size:0.85em;margin:0 2px">${cnt}</span><span class="arrow">&#9656;</span>`;
          b.onclick = () => {
            const sub = document.getElementById(`pf-sub-${barId}-${grp}`);
            if (sub) { sub.classList.toggle('open'); b.classList.toggle('expanded'); }
          };
          row1.appendChild(b);
        });
        bar.appendChild(row1);

        // Sub-rows per group
        f.groupOrder.forEach(grp => {
          const items = f.groups[grp];
          if (!items) return;
          const sub = document.createElement('div');
          sub.className = 'pf-sub'; sub.id = `pf-sub-${barId}-${grp}`;

          const allC = document.createElement('span'); allC.className = 'pf-sub-ctl';
          allC.textContent = t.filterGrpAll; allC.onclick = () => f.setGroup(grp, true);
          sub.appendChild(allC);
          const noneC = document.createElement('span'); noneC.className = 'pf-sub-ctl';
          noneC.textContent = t.filterGrpNone; noneC.onclick = () => f.setGroup(grp, false);
          sub.appendChild(noneC);
          const ss = document.createElement('span'); ss.className = 'pf-sep'; sub.appendChild(ss);

          items.forEach(it => {
            const chip = document.createElement('span');
            chip.className = 'pf-type' + (f.state[it.key] ? ' on' : '');
            chip.id = `pf-${barId}-${it.key}`;
            chip.style.setProperty('--c', f.groupColors[grp] || '#4a5568');
            chip.textContent = it.label;
            chip.title = it.key;
            chip.onclick = () => f.toggle(it.key);
            sub.appendChild(chip);
          });
          bar.appendChild(sub);
        });
      } else {
        // Single group: flat row with chips
        const sep = document.createElement('span'); sep.className = 'pf-sep';
        row1.appendChild(sep);
        const grp = f.groupOrder[0];
        (f.groups[grp] || []).forEach(it => {
          const chip = document.createElement('span');
          chip.className = 'pf-type' + (f.state[it.key] ? ' on' : '');
          chip.id = `pf-${barId}-${it.key}`;
          chip.style.setProperty('--c', f.groupColors[grp] || '#4a5568');
          chip.textContent = it.label;
          chip.title = it.key;
          chip.onclick = () => f.toggle(it.key);
          row1.appendChild(chip);
        });
        bar.appendChild(row1);
      }
    },

    updateLabels(t) {
      const ctrls = document.querySelectorAll(`#${barId} .pf-ctrl`);
      if (ctrls.length >= 3) { ctrls[0].textContent = t.filterAll; ctrls[1].textContent = t.filterNone; ctrls[2].textContent = t.filterReset; }
      document.querySelectorAll(`#${barId} .pf-sub-ctl`).forEach((el, i) => {
        el.textContent = i % 2 === 0 ? t.filterGrpAll : t.filterGrpNone;
      });
    },
  };
  return f;
}

// CEA Price filter instance
let ceaPriceFilter = null;
function buildCeaPriceFilter(years, yearColors, volDefs, t) {
  ceaPriceFilter = createFilter('cea-price-chart', 'cea-price-filter');
  const f = ceaPriceFilter;
  f.groupOrder = [t.grpPrice, t.grpVolume];
  f.groupColors[t.grpPrice] = '#63b3ed';
  f.groupColors[t.grpVolume] = '#a0aec0';
  const volLabels = [t.volListed, t.volBlock, t.volTotal];
  const volColors = ['rgba(66,153,225,0.7)', 'rgba(245,101,101,0.7)', 'rgba(160,174,192,0.5)'];

  years.forEach((yr, i) => {
    const key = `price-${yr}`;
    f.state[key] = true;
    f.defaultOn.add(key);
    f.traceMap[key] = i;
    if (!f.groups[t.grpPrice]) f.groups[t.grpPrice] = [];
    f.groups[t.grpPrice].push({ key, label: yr });
    f.groupColors[t.grpPrice] = '#63b3ed';
  });
  volDefs.forEach((v, i) => {
    const key = `vol-${v.key}`;
    f.state[key] = false; // hidden by default
    f.traceMap[key] = years.length + i;
    if (!f.groups[t.grpVolume]) f.groups[t.grpVolume] = [];
    f.groups[t.grpVolume].push({ key, label: volLabels[i] });
  });
  f.build(t);
}

// Box plot filter instance
let boxFilter = null;
function buildBoxFilter(years, colors, t) {
  boxFilter = createFilter('cea-annual-box', 'box-filter');
  const f = boxFilter;
  f.groupOrder = ['years'];
  f.groupColors['years'] = '#63b3ed';
  years.forEach((yr, i) => {
    f.state[yr] = true;
    f.defaultOn.add(yr);
    f.traceMap[yr] = i;
    if (!f.groups['years']) f.groups['years'] = [];
    f.groups['years'].push({ key: yr, label: yr });
    f.groupColors['years'] = colors[i % colors.length];
  });
  f.build(t);
}

function updateChartLabels(lang) {
  const t = i18n[lang];

  // CEA Price — title + y-axis only
  if (document.getElementById('cea-price-chart').data) {
    Plotly.relayout('cea-price-chart', {
      'title.text': t.ceaPriceTrend,
      'yaxis.title.text': t.priceUnit,
      'yaxis2.title': t.volumeUnit,
    });
    // Update volume trace names
    const volNames = [t.volListed, t.volBlock, t.volTotal];
    const el = document.getElementById('cea-price-chart');
    if (el.data) {
      const nYears = el.data.length - 3;
      volNames.forEach((nm, i) => { if (nYears + i < el.data.length) Plotly.restyle('cea-price-chart', { name: nm }, [nYears + i]); });
    }
  }
  // Update filter labels
  if (ceaPriceFilter) ceaPriceFilter.updateLabels(t);
  if (boxFilter) boxFilter.updateLabels(t);

  // Candlestick
  if (document.getElementById('cea-candlestick-chart').data) {
    Plotly.relayout('cea-candlestick-chart', {
      'title.text': t.ceaCandlestick,
      'yaxis.title': t.priceUnit,
      'yaxis2.title': t.volumeUnit,
    });
  }

  // Box plot
  if (document.getElementById('cea-annual-box').data) {
    Plotly.relayout('cea-annual-box', {
      'title.text': t.annualDistribution,
      'yaxis.title': t.closingPrice,
    });
  }

  // Heatmap — month labels need restyle
  if (document.getElementById('cea-monthly-heatmap').data) {
    Plotly.relayout('cea-monthly-heatmap', { 'title.text': t.monthlyHeatmap });
    Plotly.restyle('cea-monthly-heatmap', { x: [t.months] }, [0]);
    Plotly.relayout('cea-monthly-heatmap', { 'colorbar.title.text': t.volumeWan });
  }

  // CCER Price
  if (document.getElementById('ccer-price-chart').data) {
    Plotly.relayout('ccer-price-chart', {
      'title.text': t.ccerPriceTrend,
      'yaxis.title': t.priceUnit,
    });
  }
}

function renderCharts(lang) {
  if (!chartsInitialized) {
    initCharts(lang);
  } else {
    updateChartLabels(lang);
  }
}

function switchLang(lang) {
  currentLang = lang;
  const t = i18n[lang];
  document.getElementById('main-title').textContent = t.title;
  document.getElementById('sub-title').textContent = t.subtitle;
  document.getElementById('ds-title').textContent = t.dataSource;
  document.getElementById('ds-cea').textContent = t.ceaSource;
  document.getElementById('ds-ccer').textContent = t.ccerSource;
  document.getElementById('ds-disclaimer').textContent = t.disclaimer;
  renderCards(lang);
  renderCharts(lang);
  try { localStorage.setItem('ets-dashboard-lang', lang); } catch(e) {}
}

// Initialize with saved preference or default (localStorage may throw on file://)
let savedLang = 'cn';
try { savedLang = localStorage.getItem('ets-dashboard-lang') || 'cn'; } catch(e) {}
document.getElementById('lang-select').value = savedLang;
switchLang(savedLang);
